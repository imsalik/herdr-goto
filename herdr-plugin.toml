# herdr-plugin.toml — manifest for the herdr-goto workspace switcher.
# Registers the plugin with herdr (`herdr plugin link` / `herdr plugin list`).
# goto is launched as a popup keybinding, not via this action — see README.

id = "herdr-goto"
name = "herdr-goto"
version = "0.1.0"
description = "A sessionx-style workspace/agent/pane switcher in an fzf popup (prefix+o)."
min_herdr_version = "0.7.0"
platforms = ["linux", "macos"]

[[actions]]
id = "open-goto"
title = "goto (workspace switcher)"
description = "Fuzzy-find across workspaces, agents, and panes; jump to the selection."
command = ["bash", "goto.sh"]

# Track every workspace focus (chords, navigator, sidebar, CLI) so goto's
# previous-first MRU stays true regardless of how the switch happened.
[[events]]
on = "workspace.focused"
command = ["sh", "-c", "exec bash \"${HERDR_PLUGIN_ROOT:-.}/goto.sh\" --track"]
